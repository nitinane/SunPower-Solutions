services:
  api:
    volumes: ["./backend:/app", "./storage:/app/storage"]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=*", "--reload"]
    ports: ["127.0.0.1:8000:8000"]
  db:
    ports: ["127.0.0.1:5432:5432"]
  frontend-dev:
    image: node:22.14.0-alpine
    working_dir: /app
    volumes: ["./frontend:/app", "frontend_node_modules:/app/node_modules"]
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]
    environment: {VITE_PROXY_TARGET: "http://api:8000"}
    ports: ["127.0.0.1:5173:5173"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
volumes:
  frontend_node_modules:
